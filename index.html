    linear-gradient(
      145deg,

  -webkit-backdrop-filter:blur(14px);
}

.avatar{

    linear-gradient(

.card-info{

.card-info h3{

  white-space:nowrap;

.meta{

  font-size:10px;
  line-height:1.8;

.view{
  color:#fff;
  text-decoration:none;
  white-space:nowrap;

  padding:9px 11px;
  border-radius:10px;
  font-size:10px;

  background:

.empty{

  }

  .hero h1{
    font-size:21px;
  }

}

@media(max-width:350px){

  .categories{
    grid-template-columns:1fr;
  }

}

/* =========================
   لینک‌های ذخیره شده
========================= */

let savedLinks = [];

try{

  savedLinks =
    JSON.parse(
      localStorage.getItem("rubikaLinks")
    ) || [];

}catch(error){

  savedLinks = [];

}


/* =========================
   ابزارها
========================= */

function clean(value){

  return String(value || "")
    .trim()
    .toLowerCase();

}


function escapeText(value){

  return String(value || "")

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   نمایش لینک‌ها
========================= */

function renderLinks(list){

  const box =
    document.getElementById("userLinks");

  const count =
    document.getElementById("count");

  if(!box || !count){

    return;

  }

  box.innerHTML = "";

  count.innerText =
    list.length.toLocaleString("fa-IR") +
    " مورد";


  if(list.length === 0){

    box.innerHTML = `

      <div class="empty">

        📭

        <br>

        هنوز لینکی برای نمایش وجود ندارد.

        <br>

        از گزینه «ثبت گروه یا کانال» استفاده کن.

      </div>

    `;

    return;

  }


  list.forEach(function(item){

    const card =
      document.createElement("div");

    card.className = "card";


    const type =
      clean(item.type);


    const icon =
      type === "channel"
      ? "📢"
      : "👥";


    const typeName =
      type === "channel"
      ? "کانال"
      : "گروه";


    const title =
      item.title ||
      "بدون نام";


    const category =
      item.category ||
      "سایر";


    const link =
      item.link ||
      "#";


    card.innerHTML = `

      <div class="avatar">
        ${icon}
      </div>

      <div class="card-info">

        <h3>
          ${escapeText(title)}
        </h3>

        <div class="meta">

          ${icon} ${typeName}

          <br>

          📂 ${escapeText(category)}

        </div>

      </div>

      <a
        class="view"
        href="${escapeText(link)}"
        target="_blank"
        rel="noopener noreferrer"
      >
        ورود
      </a>

    `;


    box.appendChild(card);

  });

}


/* =========================
   دسته‌بندی
========================= */

function showCategory(type){

  let results;


  if(type === "all"){

    results = savedLinks;

    document
      .getElementById("categoryText")
      .innerText = "همه";

    document
      .getElementById("listTitle")
      .innerText =
      "⭐ لینک‌های منتخب";

  }

  else if(
    type === "group" ||
    type === "channel"
  ){

    results =
      savedLinks.filter(function(item){

        return clean(item.type) === type;

      });


    document
      .getElementById("categoryText")
      .innerText =
      type === "group"
      ? "گروه‌ها"
      : "کانال‌ها";


    document
      .getElementById("listTitle")
      .innerText =
      type === "group"
      ? "👥 گروه‌های روبیکا"
      : "📢 کانال‌های روبیکا";

  }

  else{

    results =
      savedLinks.filter(function(item){

        return clean(item.category) === type;

      });


    const names = {

      music:"🎵 موزیک",

      movie:"🎬 فیلم و سریال",

      game:"🎮 بازی و سرگرمی",

      education:"📚 آموزشی"

    };


    document
      .getElementById("categoryText")
      .innerText =
      names[type] || "دسته";


    document
      .getElementById("listTitle")
      .innerText =
      names[type] || "📂 دسته‌بندی";

  }


  renderLinks(results);

}


/* =========================
   جستجو
========================= */

function searchLinks(){

  const input =
    document.getElementById("searchInput");


  const keyword =
    clean(input.value);


  if(keyword === ""){

    showCategory("all");

    return;

  }


  const results =
    savedLinks.filter(function(item){

      const text =

        String(item.title || "") +
        " " +
        String(item.description || "") +
        " " +
        String(item.category || "") +
        " " +
        String(item.type || "");


      return clean(text)
        .includes(keyword);

    });


  document
    .getElementById("categoryText")
    .innerText = "جستجو";


  document
    .getElementById("listTitle")
    .innerText =
    "🔎 نتایج جستجو";


  renderLinks(results);

}


document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        searchLinks();

      }

    }
  );


/* =========================
   نمایش اولیه
========================= */

renderLinks(savedLinks);


/* =========================
   PWA INSTALL
========================= */

let deferredPrompt = null;

const installButton =
  document.getElementById("installButton");


/*
  Chrome وقتی برنامه قابلیت نصب داشته باشد
  این رویداد را ارسال می‌کند.
*/

window.addEventListener(
  "beforeinstallprompt",
  function(event){

    event.preventDefault();

    deferredPrompt = event;

    if(installButton){

      installButton.style.display = "block";

    }

  }
);


/*
  کلیک روی دکمه نصب
*/

if(installButton){

  installButton.addEventListener(
    "click",
    async function(){

      if(!deferredPrompt){

        alert(
          "📲 نصب مستقیم در حال حاضر توسط مرورگر آماده نیست.\n\n"+
          "در Chrome از منوی سه‌نقطه، گزینه «افزودن به صفحه اصلی» یا «Install app» را انتخاب کنید."
        );

        return;

      }


      deferredPrompt.prompt();


      const result =
        await deferredPrompt.userChoice;


      if(result.outcome === "accepted"){

        installButton.style.display = "none";

      }


      deferredPrompt = null;

    }
  );

}


/*
  اگر برنامه قبلاً نصب شده باشد
*/

window.addEventListener(
  "appinstalled",
  function(){

    deferredPrompt = null;

    if(installButton){

      installButton.style.display = "none";

    }

  }
);


/* =========================
   SERVICE WORKER
========================= */

if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    function(){

      navigator.serviceWorker
        .register("./sw.js")
        .then(function(){

          console.log(
            "Service Worker فعال شد."
          );

        })
        .catch(function(error){

          console.log(
            "خطا در Service Worker:",
            error
          );

        });

    }
  );

}
