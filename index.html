<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>لینک‌دونی کرمانشاه</title><style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


/* =========================
   BODY
========================= */

html{
    min-height:100%;
    background:#050507;
}

body{

    min-height:100vh;

    font-family:
    Tahoma,
    Arial,
    sans-serif;

    color:#ffffff;

    background:

    radial-gradient(
        circle at 15% 10%,
        rgba(132,55,255,.20),
        transparent 28%
    ),

    radial-gradient(
        circle at 90% 25%,
        rgba(185,70,255,.13),
        transparent 30%
    ),

    linear-gradient(
        145deg,
        #030304,
        #0a0710 45%,
        #050507
    );

}


/* =========================
   CONTAINER
========================= */

.container{

    width:100%;

    max-width:720px;

    margin:0 auto;

}


/* =========================
   HEADER
========================= */

.header{

    width:100%;

    padding:
    18px
    15px
    35px;

    border-radius:
    0
    0
    32px
    32px;

    background:

    linear-gradient(
        135deg,
        rgba(20,12,32,.95),
        rgba(61,20,105,.82)
    );

    border-bottom:
    1px solid
    rgba(190,110,255,.35);

    box-shadow:
    0 15px 50px
    rgba(112,36,220,.18);

}


/* =========================
   TOP
========================= */

.top{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

}


.logo{

    font-size:19px;

    font-weight:bold;

    color:#ffffff;

    text-shadow:
    0 0 15px
    rgba(184,105,255,.65);

}


/* =========================
   TOP BUTTONS
========================= */

.top-links{

    display:flex;

    gap:7px;

}


.top-links a{

    display:inline-block;

    text-decoration:none;

    color:#ffffff;

    padding:
    9px
    11px;

    border-radius:12px;

    font-size:10px;

    font-weight:bold;

    background:
    rgba(255,255,255,.08);

    border:
    1px solid
    rgba(255,255,255,.20);

    backdrop-filter:
    blur(14px);

    -webkit-backdrop-filter:
    blur(14px);

    box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.14),

    0 5px 20px
    rgba(0,0,0,.25);

    transition:.2s;

}


.top-links a:hover{

    border-color:
    rgba(197,116,255,.8);

    box-shadow:
    0 0 18px
    rgba(151,62,255,.35);

}


/* =========================
   HERO
========================= */

.hero{

    text-align:center;

    padding:
    35px
    5px
    0;

}


.hero h1{

    margin-bottom:12px;

    font-size:24px;

    line-height:1.7;

    color:#ffffff;

    text-shadow:
    0 0 25px
    rgba(179,91,255,.55);

}


.hero p{

    font-size:12px;

    line-height:2;

    color:#cfc5d9;

}


/* =========================
   SEARCH
========================= */

.search{

    display:flex;

    gap:6px;

    margin-top:22px;

    padding:6px;

    border-radius:16px;

    background:
    rgba(255,255,255,.08);

    border:
    1px solid
    rgba(255,255,255,.18);

    backdrop-filter:
    blur(18px);

    -webkit-backdrop-filter:
    blur(18px);

    box-shadow:
    inset 0 1px 0
    rgba(255,255,255,.10),

    0 10px 35px
    rgba(0,0,0,.35);

}


.search input{

    width:100%;

    min-width:0;

    border:0;

    outline:0;

    background:transparent;

    color:#ffffff;

    padding:13px;

    font-family:Tahoma;

    font-size:12px;

}


.search input::placeholder{

    color:#b9adbf;

}


.search button{

    border:0;

    cursor:pointer;

    color:#ffffff;

    font-family:Tahoma;

    font-weight:bold;

    padding:
    0
    15px;

    border-radius:11px;

    background:
    rgba(157,67,255,.35);

    border:
    1px solid
    rgba(211,157,255,.45);

    backdrop-filter:
    blur(12px);

    -webkit-backdrop-filter:
    blur(12px);

    box-shadow:
    0 0 18px
    rgba(143,47,255,.25);

}


/* =========================
   MAIN
========================= */

main{

    width:100%;

    max-width:720px;

    margin:0 auto;

    padding:
    22px
    15px;

}


/* =========================
   SECTION TITLE
========================= */

.section-title{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:14px;

}


.section-title h2{

    font-size:16px;

    color:#ffffff;

}


.section-title span{

    color:#a99eaf;

    font-size:10px;

}


/* =========================
   CATEGORIES
========================= */

.categories{

    display:grid;

    grid-template-columns:
    repeat(
        2,
        minmax(0,1fr)
    );

    gap:11px;

}


.category{

    width:100%;

    border-radius:18px;

    padding:
    19px
    8px;

    text-align:center;

    cursor:pointer;

    font-family:Tahoma;

    color:#ffffff;

    background:
    rgba(255,255,255,.055);

    border:
    1px solid
    rgba(255,255,255,.15);

    backdrop-filter:
    blur(18px);

    -webkit-backdrop-filter:
    blur(18px);

    box-shadow:

    inset 0 1px 0
    rgba(255,255,255,.10),

    0 10px 25px
    rgba(0,0,0,.25);

    transition:
    transform .18s,
    border-color .18s,
    box-shadow .18s;

}


.category:hover{

    border-color:
    rgba(190,100,255,.65);

    box-shadow:

    0 0 22px
    rgba(139,45,255,.22),

    inset 0 1px 0
    rgba(255,255,255,.15);

}


.category:active{

    transform:
    scale(.95);

}


.category .icon{

    display:block;

    font-size:29px;

}


.category .name{

    display:block;

    margin-top:9px;

    font-size:11px;

    font-weight:bold;

}


/* =========================
   ACTIONS
========================= */

.actions{

    display:grid;

    gap:11px;

    margin:
    22px
    0;

}


.action{

    display:block;

    width:100%;

    padding:15px;

    border-radius:15px;

    text-align:center;

    text-decoration:none;

    font-size:12px;

    font-weight:bold;

    color:#ffffff;

    background:
    rgba(255,255,255,.07);

    border:
    1px solid
    rgba(255,255,255,.20);

    backdrop-filter:
    blur(18px);

    -webkit-backdrop-filter:
    blur(18px);

    box-shadow:

    inset 0 1px 0
    rgba(255,255,255,.12),

    0 10px 30px
    rgba(0,0,0,.30);

    transition:.2s;

}


.action:hover{

    border-color:
    rgba(193,105,255,.75);

    box-shadow:

    0 0 25px
    rgba(146,47,255,.28),

    inset 0 1px 0
    rgba(255,255,255,.15);

    transform:
    translateY(-1px);

}


.add-link{

    background:
    linear-gradient(
        135deg,
        rgba(111,43,180,.24),
        rgba(255,255,255,.06)
    );

}


.premium-link{

    background:
    linear-gradient(
        135deg,
        rgba(180,65,255,.30),
        rgba(255,255,255,.06)
    );

}


/* =========================
   CARDS
========================= */

.cards{

    display:grid;

    gap:11px;

}


.card{

    width:100%;

    display:flex;

    align-items:center;

    gap:11px;

    padding:14px;

    border-radius:18px;

    background:
    rgba(255,255,255,.055);

    border:
    1px solid
    rgba(255,255,255,.13);

    backdrop-filter:
    blur(18px);

    -webkit-backdrop-filter:
    blur(18px);

    box-shadow:

    inset 0 1px 0
    rgba(255,255,255,.08),

    0 10px 30px
    rgba(0,0,0,.30);

}


.avatar{

    width:48px;

    height:48px;

    min-width:48px;

    border-radius:14px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:22px;

    background:
    rgba(151,65,255,.16);

    border:
    1px solid
    rgba(202,133,255,.25);

    box-shadow:
    0 0 18px
    rgba(133,46,255,.18);

}


.card-info{

    flex:1;

    min-width:0;

}


.card-info h3{

    margin:
    0
    0
    6px;

    font-size:13px;

    color:#ffffff;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

}


.meta{

    color:#aaa0b0;

    font-size:10px;

    line-height:1.8;

}


.view{

    color:#ffffff;

    text-decoration:none;

    padding:
    9px
    11px;

    border-radius:10px;

    font-size:10px;

    white-space:nowrap;

    background:
    rgba(151,61,255,.20);

    border:
    1px solid
    rgba(207,143,255,.30);

    backdrop-filter:
    blur(12px);

    -webkit-backdrop-filter:
    blur(12px);

}


/* =========================
   EMPTY
========================= */

.empty{

    width:100%;

    padding:
    28px
    15px;

    border-radius:18px;

    text-align:center;

    color:#aaa0b0;

    font-size:12px;

    line-height:2;

    background:
    rgba(255,255,255,.045);

    border:
    1px solid
    rgba(255,255,255,.12);

    backdrop-filter:
    blur(18px);

    -webkit-backdrop-filter:
    blur(18px);

}


/* =========================
   FOOTER
========================= */

footer{

    text-align:center;

    color:#827687;

    font-size:10px;

    padding:
    22px
    10px
    35px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:420px){

    .top{

        flex-direction:column;

        align-items:stretch;

    }


    .logo{

        text-align:center;

        margin-bottom:3px;

    }


    .top-links{

        width:100%;

    }


    .top-links a{

        flex:1;

        text-align:center;

    }


    .hero h1{

        font-size:20px;

    }

}


/* =========================
   SMALL SCREEN
========================= */

@media(max-width:350px){

    .categories{

        grid-template-columns:1fr;

    }


    .card{

        padding:11px;

    }


    .view{

        padding:
        8px;

    }

}

</style></head><body><header class="header"><div class="container"><div class="top"><div class="logo">🔗 لینک‌دونی کرمانشاه

</div><div class="top-links"><a href="admin.html">🛠️ مدیریت

</a><a href="register.html">👤 ورود

</a></div></div><div class="hero"><h1>لینک‌دونی کرمانشاه

</h1><p>گروه‌ها و کانال‌های روبیکای کرمانشاه را پیدا کن

<br>معرفی، جستجو و ثبت لینک در یکجا

</p></div><div class="search"><input
id="searchInput"
type="search"
placeholder="نام گروه، کانال یا موضوع..."

«»

<button
type="button"
onclick="searchLinks()"

«»

جستجو

</button></div></div></header><main><div class="section-title"><h2>📂 دسته‌بندی‌ها

</h2><span id="categoryText">همه

</span></div><div class="categories"><button
class="category"
type="button"
onclick="showCategory('all')"

«»

<span class="icon">⭐

</span><span class="name">همه لینک‌ها

</span></button><button
class="category"
type="button"
onclick="showCategory('group')"

«»

<span class="icon">👥

</span><span class="name">گروه‌های روبیکا

</span></button><button
class="category"
type="button"
onclick="showCategory('channel')"

«»

<span class="icon">📢

</span><span class="name">کانال‌های روبیکا

</span></button><button
class="category"
type="button"
onclick="showCategory('music')"

«»

<span class="icon">🎵

</span><span class="name">موزیک

</span></button><button
class="category"
type="button"
onclick="showCategory('movie')"

«»

<span class="icon">🎬

</span><span class="name">فیلم و سریال

</span></button><button
class="category"
type="button"
onclick="showCategory('game')"

«»

<span class="icon">🎮

</span><span class="name">بازی و سرگرمی

</span></button><button
class="category"
type="button"
onclick="showCategory('education')"

«»

<span class="icon">📚

</span><span class="name">آموزشی

</span></button></div><div class="actions"><a
href="add-link.html"
class="action add-link"

«»

</a><a
href="premium.html"
class="action premium-link"

«»

⭐ ثبت لینک ویژه

</a></div><div class="section-title"><h2 id="listTitle">⭐ لینک‌های منتخب

</h2><span id="count">۰ مورد

</span></div><div
id="userLinks"
class="cards"
>
</div></main><footer>© 2026 لینک‌دونی کرمانشاه

</footer><script>


let savedLinks = [];


try{

    savedLinks =
    JSON.parse(
        localStorage.getItem("rubikaLinks")
    ) || [];

}catch(error){

    savedLinks = [];

}



function clean(value){

    return String(value || "")
    .trim()
    .toLowerCase();

}



function escapeText(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}



function renderLinks(list){

    const box =
    document.getElementById("userLinks");

    const count =
    document.getElementById("count");


    box.innerHTML = "";

    count.innerText =
    list.length + " مورد";


    if(list.length === 0){

        box.innerHTML = `

        <div class="empty">

        📭

        <br>

        هنوز لینکی برای نمایش وجود ندارد.

        <br>

        از گزینه «ثبت گروه یا کانال» استفاده کن.

        </div>

        `;

        return;

    }


    list.forEach(function(item){

        const card =
        document.createElement("div");

        card.className =
        "card";


        const type =
        clean(item.type);


        const icon =
        type === "channel"
        ? "📢"
        : "👥";


        const typeName =
        type === "channel"
        ? "کانال"
        : "گروه";


        const title =
        item.title ||
        "بدون نام";


        const category =
        item.category ||
        "سایر";


        const link =
        item.link ||
        "#";


        card.innerHTML = `

        <div class="avatar">

        ${icon}

        </div>


        <div class="card-info">

        <h3>

        ${escapeText(title)}

        </h3>


        <div class="meta">

        ${icon} ${typeName}

        <br>

        📂 ${escapeText(category)}

        </div>

        </div>


        <a

        class="view"

        href="${escapeText(link)}"

        target="_blank"

        rel="noopener noreferrer"

        >

        ورود

        </a>

        `;


        box.appendChild(card);

    });

}



function showCategory(type){

    let results;


    if(type === "all"){

        results =
        savedLinks;


        document
        .getElementById("categoryText")
        .innerText =
        "همه";


        document
        .getElementById("listTitle")
        .innerText =
        "⭐ لینک‌های منتخب";

    }


    else if(
        type === "group" ||
        type === "channel"
    ){

        results =
        savedLinks.filter(function(item){

            return clean(item.type) ===
            type;

        });


        document
        .getElementById("categoryText")
        .innerText =
        type === "group"
        ? "گروه‌ها"
        : "کانال‌ها";


        document
        .getElementById("listTitle")
        .innerText =
        type === "group"
        ? "👥 گروه‌های روبیکا"
        : "📢 کانال‌های روبیکا";

    }


    else{

        results =
        savedLinks.filter(function(item){

            return clean(item.category) ===
            type;

        });


        const names = {

            music:"🎵 موزیک",

            movie:"🎬 فیلم و سریال",

            game:"🎮 بازی و سرگرمی",

            education:"📚 آموزشی"

        };


        document
        .getElementById("categoryText")
        .innerText =
        names[type] || "دسته";


        document
        .getElementById("listTitle")
        .innerText =
        names[type] || "📂 دسته‌بندی";

    }


    renderLinks(results);

}



function searchLinks(){

    const input =
    document.getElementById("searchInput");


    const keyword =
    clean(input.value);


    if(keyword === ""){

        showCategory("all");

        return;

    }


    const results =
    savedLinks.filter(function(item){

        const text =

        String(
            item.title || ""
        ) + " " +

        String(
            item.description || ""
        ) + " " +

        String(
            item.category || ""
        ) + " " +

        String(
            item.type || ""
        );


        return clean(text)
        .includes(keyword);

    });


    document
    .getElementById("categoryText")
    .innerText =
    "جستجو";


    document
    .getElementById("listTitle")
    .innerText =
    "🔎 نتایج جستجو";


    renderLinks(results);

}



document
.getElementById("searchInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            searchLinks();

        }

    }
);



renderLinks(savedLinks);

</script></body></html>
