<!DOCTYPE html><html lang="fa" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>لینک‌دونی روبیکا</title><style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#f4f6fb;
    color:#172033;
}

.header{
    width:100%;
    background:linear-gradient(135deg,#4d5bea,#7138d8);
    color:#fff;
    padding:20px 15px 30px;
    border-radius:0 0 28px 28px;
}

.container{
    width:100%;
    max-width:700px;
    margin:0 auto;
}

.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.logo{
    font-size:18px;
    font-weight:bold;
}

.top-links{
    display:flex;
    gap:6px;
}

.top-links a{
    display:inline-block;
    background:#fff;
    color:#4d55d8;
    text-decoration:none;
    padding:9px 10px;
    border-radius:10px;
    font-size:10px;
    font-weight:bold;
}

.hero{
    text-align:center;
    padding:30px 5px 0;
}

.hero h1{
    margin:0 0 10px;
    font-size:22px;
}

.hero p{
    margin:0;
    font-size:12px;
    line-height:2;
}

.search{
    display:flex;
    gap:5px;
    background:#fff;
    padding:6px;
    margin-top:20px;
    border-radius:14px;
}

.search input{
    width:100%;
    min-width:0;
    border:0;
    outline:0;
    padding:12px;
    font-family:Tahoma;
    font-size:12px;
}

.search button{
    border:0;
    background:#4d5bea;
    color:#fff;
    border-radius:10px;
    padding:0 14px;
    font-family:Tahoma;
    font-weight:bold;
}

main{
    width:100%;
    max-width:700px;
    margin:0 auto;
    padding:20px 15px;
}

.section-title{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.section-title h2{
    margin:0;
    font-size:16px;
}

.section-title span{
    color:#777;
    font-size:10px;
}

.categories{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
}

.category{
    width:100%;
    border:1px solid #e3e5ed;
    background:#fff;
    border-radius:16px;
    padding:17px 8px;
    text-align:center;
    cursor:pointer;
    font-family:Tahoma;
}

.category:active{
    transform:scale(.97);
}

.category .icon{
    font-size:27px;
}

.category .name{
    display:block;
    margin-top:8px;
    font-size:12px;
    font-weight:bold;
}

.actions{
    display:grid;
    grid-template-columns:1fr;
    gap:10px;
    margin:20px 0;
}

.action{
    display:block;
    width:100%;
    padding:14px;
    border-radius:13px;
    text-align:center;
    text-decoration:none;
    font-size:12px;
    font-weight:bold;
}

.add-link{
    background:#172033;
    color:#fff;
}

.premium-link{
    background:#ff8a00;
    color:#fff;
}

.cards{
    display:grid;
    gap:10px;
}

.card{
    width:100%;
    background:#fff;
    border:1px solid #e3e5ed;
    border-radius:16px;
    padding:13px;
    display:flex;
    align-items:center;
    gap:10px;
}

.avatar{
    width:46px;
    height:46px;
    min-width:46px;
    border-radius:12px;
    background:#eef0ff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
}

.card-info{
    flex:1;
    min-width:0;
}

.card-info h3{
    margin:0 0 6px;
    font-size:13px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.meta{
    color:#777;
    font-size:10px;
    line-height:1.8;
}

.view{
    background:#4d5bea;
    color:#fff;
    text-decoration:none;
    padding:8px 10px;
    border-radius:9px;
    font-size:10px;
    white-space:nowrap;
}

.empty{
    width:100%;
    background:#fff;
    border-radius:16px;
    padding:25px 12px;
    text-align:center;
    color:#777;
    font-size:12px;
    line-height:2;
}

footer{
    text-align:center;
    color:#888;
    font-size:10px;
    padding:20px 10px 30px;
}

@media(max-width:420px){

    .top{
        flex-direction:column;
        align-items:stretch;
    }

    .logo{
        text-align:center;
    }

    .top-links{
        width:100%;
    }

    .top-links a{
        flex:1;
        text-align:center;
    }

    .hero h1{
        font-size:19px;
    }

}

</style></head><body><header class="header"><div class="container"><div class="top"><div class="logo">
🔗 لینک‌دونی روبیکا
</div><div class="top-links"><a href="admin.html">
🛠️ مدیریت
</a><a href="register.html">
👤 ورود
</a></div></div><div class="hero"><h1>
گروه و کانال روبیکای خودت رو پیدا کن
</h1><p>
محلی برای پیدا کردن، معرفی و جستجوی گروه‌ها و کانال‌های روبیکا
</p></div><div class="search"><input
id="searchInput"
type="search"
placeholder="نام گروه، کانال یا موضوع..."

<button
type="button"
onclick="searchLinks()"

</div></div></header><main><div class="section-title"><h2>
📂 دسته‌بندی‌ها
</h2><span id="categoryText">
همه
</span></div><div class="categories"><button
class="category"
type="button"
onclick="showCategory('all')"

«»

<span class="icon">⭐</span>

<span class="name">
همه لینک‌ها
</span></button><button
class="category"
type="button"
onclick="showCategory('group')"

«»

<span class="icon">👥</span>

<span class="name">
گروه‌های روبیکا
</span></button><button
class="category"
type="button"
onclick="showCategory('channel')"

«»

<span class="name">
کانال‌های روبیکا
</span></button><button
class="category"
type="button"
onclick="showCategory('music')"

«»

<span class="icon">🎵</span>

<span class="name">
موزیک
</span></button><button
class="category"
type="button"
onclick="showCategory('movie')"

«»

<span class="icon">🎬</span>

<span class="name">
فیلم و سریال
</span></button><button
class="category"
type="button"
onclick="showCategory('game')"

«»

<span class="icon">🎮</span>

<span class="name">
بازی و سرگرمی
</span></button><button
class="category"
type="button"
onclick="showCategory('education')"

«»

<span class="icon">📚</span>

<span class="name">
آموزشی
</span></button></div><div class="actions"><a
href="add-link.html"
class="action add-link"

«»

➕ ثبت گروه یا کانال روبیکا
</a>

<a
href="premium.html"
class="action premium-link"

«»

⭐ ثبت لینک ویژه
</a>

</div><div class="section-title"><h2 id="listTitle">
⭐ لینک‌های منتخب
</h2><span id="count">
۰ مورد
</span></div><div
id="userLinks"
class="cards"
>
</div></main><footer>© 2026 لینک‌دونی روبیکا

</footer><script>

let savedLinks = [];

try{

    savedLinks =
        JSON.parse(
            localStorage.getItem("rubikaLinks")
        ) || [];

}catch(error){

    savedLinks = [];

}



function clean(value){

    return String(value || "")
        .trim()
        .toLowerCase();

}



function renderLinks(list){

    const box =
        document.getElementById("userLinks");

    const count =
        document.getElementById("count");


    box.innerHTML = "";

    count.innerText =
        list.length + " مورد";


    if(list.length === 0){

        box.innerHTML = `

        <div class="empty">

        📭

        <br>

        لینکی برای نمایش وجود ندارد.

        <br>

        می‌توانی از گزینه «ثبت گروه یا کانال» استفاده کنی.

        </div>

        `;

        return;

    }


    list.forEach(function(item){

        const card =
            document.createElement("div");

        card.className = "card";


        const type =
            clean(item.type);


        const icon =
            type === "channel"
            ? "📢"
            : "👥";


        const typeName =
            type === "channel"
            ? "کانال"
            : "گروه";


        const title =
            item.title ||
            "بدون نام";


        const category =
            item.category ||
            "سایر";


        const link =
            item.link ||
            "#";


        card.innerHTML = `

        <div class="avatar">
        ${icon}
        </div>

        <div class="card-info">

        <h3>
        ${escapeText(title)}
        </h3>

        <div class="meta">
        ${icon} ${typeName}
        <br>
        📂 ${escapeText(category)}
        </div>

        </div>

        <a
        class="view"
        href="${escapeAttribute(link)}"
        target="_blank"
        rel="noopener"
        >
        ورود
        </a>

        `;


        box.appendChild(card);

    });

}



function showCategory(type){

    let results;


    if(type === "all"){

        results =
            savedLinks;

        document
        .getElementById("categoryText")
        .innerText =
            "همه";

        document
        .getElementById("listTitle")
        .innerText =
            "⭐ لینک‌های منتخب";

    }


    else if(
        type === "group" ||
        type === "channel"
    ){

        results =
            savedLinks.filter(function(item){

                return clean(item.type) === type;

            });


        document
        .getElementById("categoryText")
        .innerText =
            type === "group"
            ? "گروه‌ها"
            : "کانال‌ها";


        document
        .getElementById("listTitle")
        .innerText =
            type === "group"
            ? "👥 گروه‌های روبیکا"
            : "📢 کانال‌های روبیکا";

    }


    else{

        results =
            savedLinks.filter(function(item){

                return clean(item.category) ===
                       type;

            });


        const names = {

            music:"🎵 موزیک",

            movie:"🎬 فیلم و سریال",

            game:"🎮 بازی و سرگرمی",

            education:"📚 آموزشی"

        };


        document
        .getElementById("categoryText")
        .innerText =
            names[type] || "دسته";


        document
        .getElementById("listTitle")
        .innerText =
            names[type] || "📂 دسته‌بندی";

    }


    renderLinks(results);

}



function searchLinks(){

    const input =
        document.getElementById("searchInput");

    const keyword =
        clean(input.value);


    if(keyword === ""){

        showCategory("all");

        return;

    }


    const results =
        savedLinks.filter(function(item){

            const text = (

                item.title || "" +
                " " +
                item.description || "" +
                " " +
                item.category || "" +
                " " +
                item.type || ""

            ).toLowerCase();


            return text.includes(keyword);

        });


    document
    .getElementById("categoryText")
    .innerText =
        "جستجو";


    document
    .getElementById("listTitle")
    .innerText =
        "🔎 نتایج جستجو";


    renderLinks(results);

}



document
.getElementById("searchInput")
.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){

            searchLinks();

        }

    }
);



function escapeText(value){

    return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}



function escapeAttribute(value){

    return escapeText(value);

}



renderLinks(savedLinks);

</script></body></html>
