<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>لینک‌دونی روبیکا</title><style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Tahoma,Arial,sans-serif;
background:#f4f6fb;
color:#172033;
}

.header{
background:linear-gradient(135deg,#4d5bea,#7138d8);
color:white;
padding:20px 15px 35px;
border-radius:0 0 30px 30px;
}

.container{
max-width:700px;
margin:auto;
}

.top{
display:flex;
align-items:center;
justify-content:space-between;
gap:8px;
flex-wrap:wrap;
}

.logo{
font-size:20px;
font-weight:bold;
}

.top-buttons{
display:flex;
gap:7px;
flex-wrap:wrap;
}

.login{
display:inline-block;
background:white;
color:#4d4fd8;
text-decoration:none;
border-radius:11px;
padding:10px 12px;
font-size:11px;
font-weight:bold;
}

.hero{
text-align:center;
margin-top:30px;
}

.hero h1{
font-size:23px;
margin-bottom:10px;
}

.hero p{
font-size:12px;
line-height:2;
opacity:.9;
}

.search{
margin-top:22px;
background:white;
padding:6px;
border-radius:15px;
display:flex;
}

.search input{
flex:1;
border:0;
outline:none;
padding:13px;
font-family:Tahoma;
font-size:13px;
min-width:0;
}

.search button{
border:0;
background:#4d5bea;
color:white;
border-radius:10px;
padding:0 15px;
font-family:Tahoma;
font-weight:bold;
cursor:pointer;
}

main{
padding:22px 15px;
}

.title{
display:flex;
align-items:center;
justify-content:space-between;
margin-bottom:14px;
}

.title h2{
font-size:17px;
}

.title span{
font-size:11px;
color:#777;
}

.categories{
display:grid;
grid-template-columns:1fr 1fr;
gap:11px;
}

.category{
background:white;
border:1px solid #e7e9f0;
border-radius:17px;
padding:18px 8px;
text-align:center;
cursor:pointer;
transition:.15s;
}

.category:hover{
border-color:#4d5bea;
}

.category:active{
transform:scale(.96);
}

.category .icon{
font-size:28px;
}

.category b{
display:block;
margin-top:8px;
font-size:12px;
}

.action-buttons{
display:grid;
gap:10px;
margin:20px 0;
}

.action{
display:block;
text-align:center;
padding:15px;
border-radius:14px;
text-decoration:none;
font-family:Tahoma;
font-weight:bold;
font-size:13px;
}

.add{
background:#172033;
color:white;
}

.premium{
background:linear-gradient(135deg,#ffb300,#ff7a00);
color:white;
}

.cards{
display:grid;
gap:11px;
}

.card{
background:white;
border:1px solid #e7e9f0;
border-radius:17px;
padding:14px;
display:flex;
align-items:center;
gap:11px;
}

.avatar{
width:48px;
height:48px;
min-width:48px;
background:#eef0ff;
border-radius:13px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
}

.card-info{
flex:1;
min-width:0;
}

.card-info h3{
font-size:14px;
margin-bottom:6px;
}

.meta{
font-size:10px;
color:#777;
line-height:1.8;
}

.view{
background:#4d5bea;
color:white;
text-decoration:none;
padding:9px 11px;
border-radius:9px;
font-size:10px;
white-space:nowrap;
}

.empty{
background:white;
border-radius:17px;
padding:28px 15px;
text-align:center;
color:#777;
font-size:12px;
line-height:2;
}

footer{
text-align:center;
padding:25px;
color:#888;
font-size:10px;
}

@media(max-width:480px){

.top{
justify-content:center;
}

.logo{
width:100%;
text-align:center;
margin-bottom:4px;
}

.hero h1{
font-size:20px;
}

}

</style></head><body><header class="header"><div class="container"><div class="top"><div class="logo">
🔗 لینک‌دونی روبیکا
</div><div class="top-buttons"><a
href="register.html"
class="login"

«»

👤 ورود / ثبت‌نام
</a>

<a
href="admin.html"
class="login"

«»

🛠️ مدیریت
</a>

</div></div><div class="hero"><h1>
گروه و کانال روبیکای خودت رو پیدا کن
</h1><p>
محلی برای پیدا کردن، معرفی و جستجوی گروه‌ها و کانال‌های روبیکا
</p></div><div class="search"><input
id="searchInput"
type="text"
placeholder="نام گروه، کانال یا موضوع..."

«»

<button
type="button"
onclick="searchLinks()"

«»

جستجو
</button>

</div></div></header><main class="container"><div class="title"><h2>
📂 دسته‌بندی‌ها
</h2><span>
انتخاب دسته
</span></div><div class="categories"><div
class="category"
onclick="showCategory('group')"
><div class="icon">
👥
</div><b>
گروه‌های روبیکا
</b></div><div
class="category"
onclick="showCategory('channel')"
><div class="icon">
📢
</div><b>
کانال‌های روبیکا
</b></div><div
class="category"
onclick="showCategory('music')"
><div class="icon">
🎵
</div><b>
موزیک
</b></div><div
class="category"
onclick="showCategory('movie')"
><div class="icon">
🎬
</div><b>
فیلم و سریال
</b></div><div
class="category"
onclick="showCategory('game')"
><div class="icon">
🎮
</div><b>
بازی و سرگرمی
</b></div><div
class="category"
onclick="showCategory('education')"
><div class="icon">
📚
</div><b>
آموزشی
</b></div></div><div class="action-buttons"><a
href="add-link.html"
class="action add"

«»

➕ ثبت گروه یا کانال روبیکا
</a>

<a
href="premium.html"
class="action premium"

«»

⭐ ثبت لینک ویژه
</a>

</div><div class="title"><h2 id="listTitle">
⭐ لینک‌های منتخب
</h2><span id="count">
۰ مورد
</span></div><div
class="cards"
id="userLinks"
>
</div></main><footer>© 2026 لینک‌دونی روبیکا

</footer><script>


/* دریافت اطلاعات */

let savedLinks =
JSON.parse(
localStorage.getItem("rubikaLinks")
) || [];



/* یکسان‌سازی */

function normalize(value){

return String(value || "")
.trim()
.toLowerCase()
.replace("🎵","")
.replace("🎬","")
.replace("🎮","")
.replace("📚","")
.replace("📰","")
.replace("📂","")
.trim();

}



/* نمایش لینک‌ها */

function renderLinks(list){

const container =
document.getElementById("userLinks");

const count =
document.getElementById("count");

container.innerHTML = "";

count.innerText =
list.length + " مورد";


if(list.length === 0){

container.innerHTML = `

<div class="empty">

📭

<br>

هنوز لینکی در این بخش ثبت نشده است.

<br>

از دکمه «ثبت گروه یا کانال» برای اضافه کردن لینک استفاده کن.

</div>

`;

return;

}


list.forEach(function(item){

const card =
document.createElement("div");

card.className =
"card";


const icon =
normalize(item.type) === "channel"
? "📢"
: "👥";


const typeText =
normalize(item.type) === "channel"
? "کانال"
: "گروه";


card.innerHTML = `

<div class="avatar">
${icon}
</div>

<div class="card-info">

<h3>
${escapeHTML(item.title || "بدون نام")}
</h3>

<div class="meta">
${icon} ${typeText}
<br>
📂 ${escapeHTML(item.category || "سایر")}
</div>

</div>

<a
href="${safeLink(item.link)}"
target="_blank"
rel="noopener noreferrer"
class="view"
>
ورود
</a>

`;


container.appendChild(card);

});

}



/* دسته‌بندی */

function showCategory(type){

let results;


if(
type === "group" ||
type === "channel"
){

results =
savedLinks.filter(function(item){

return normalize(item.type) ===
normalize(type);

});

}

else{

results =
savedLinks.filter(function(item){

return normalize(item.category) ===
normalize(type);

});

}


const titles = {

group:"👥 گروه‌های روبیکا",

channel:"📢 کانال‌های روبیکا",

music:"🎵 موزیک",

movie:"🎬 فیلم و سریال",

game:"🎮 بازی و سرگرمی",

education:"📚 آموزشی"

};


document.getElementById("listTitle").innerText =
titles[type] || "📂 نتایج";


renderLinks(results);

}



/* جستجو */

function searchLinks(){

const keyword =
document
.getElementById("searchInput")
.value
.trim()
.toLowerCase();


if(keyword === ""){

document.getElementById("listTitle").innerText =
"⭐ لینک‌های منتخب";

renderLinks(savedLinks);

return;

}


const results =
savedLinks.filter(function(item){

const text = (

(item.title || "") +
" " +
(item.description || "") +
" " +
(item.category || "") +
" " +
(item.type || "")

).toLowerCase();


return text.includes(keyword);

});


document.getElementById("listTitle").innerText =
"🔎 نتایج جستجو";


renderLinks(results);

}



/* Enter برای جستجو */

document
.getElementById("searchInput")
.addEventListener(
"keydown",
function(event){

if(event.key === "Enter"){

searchLinks();

}

}
);



/* جلوگیری از HTML ناخواسته */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}



/* بررسی لینک */

function safeLink(value){

const link =
String(value || "").trim();


if(
link.startsWith("https://") ||
link.startsWith("http://")
){

return link;

}


if(link === ""){

return "#";

}


return "https://" + link;

}



/* اجرای اولیه */

renderLinks(savedLinks);


</script></body></html>
